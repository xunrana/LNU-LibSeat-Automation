name: lnu_libseat_mobile
description: "辽宁大学图书馆 · 智能抢座神器 手机独立版 (Android & iOS) — 纯 HTTP API 毫秒级直连 + 端侧 ONNX 验证码推理"
publish_to: "none"
version: 6.0.1+611

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  uuid: ^4.4.0
  image: ^4.2.0
  onnxruntime: ^1.4.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  wakelock_plus: ^1.2.5
  flutter_local_notifications: ^17.2.1+2
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/rooms/room_catalog.json
    - assets/images/lnu_crest.png
